name: Auto-approve and auto-merge bot pull requests
on:
  # The base-branch definition is trusted and may receive the PAT for bot PRs.
  # The reusable workflow never checks out or executes pull-request code.
  pull_request_target:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: tryAGI/workflows/.github/workflows/auto-merge.yml@main
    secrets: inherit
